    let typingTimeouts = [];
    let isSkipped = false;
    let isFinished = false;

    function clearTyping() {
      typingTimeouts.forEach(t => clearTimeout(t));
      typingTimeouts = [];
    }

    // Renderizar la carta completa de forma inmediata
    function renderFullLetter() {
      const container = document.getElementById('letter-content');
      if (!container) return;
      isSkipped = true;
      clearTyping();
      container.innerHTML = '';

      LETTER_SECTIONS.forEach(sec => {
        const el = document.createElement(sec.type === 'question' ? 'h3' : 'p');
        el.className = sec.className;

        if (sec.acrosticLetter) {
          const strong = document.createElement('strong');
          strong.className = 'acrostic-letter';
          strong.textContent = sec.acrosticLetter;
          el.appendChild(strong);
          el.appendChild(document.createTextNode(sec.text));
        } else {
          el.textContent = sec.text;
        }

        container.appendChild(el);
      });

      finishLetter();
    }

    function finishLetter() {
      clearTyping();
      isFinished = true;
      const caret = document.querySelector('.pencil-caret');
      if (caret) caret.remove();

      const statusEl = document.getElementById('letter-status-text');
      const skipBtn = document.getElementById('btn-skip-letter');
      const replayBtn = document.getElementById('btn-replay-letter');
      const footerBubu = document.getElementById('letter-footer-bubu');

      if (statusEl) statusEl.innerHTML = '✨ Carta escrita con todo mi amor ♡';
      if (skipBtn) skipBtn.style.display = 'none';
      if (replayBtn) replayBtn.style.display = 'inline-flex';
      if (footerBubu) footerBubu.style.display = 'flex';
    }

    // Animación suave de escritura a lápiz natural
    function startPencilTyping() {
      const container = document.getElementById('letter-content');
      const statusEl = document.getElementById('letter-status-text');
      const skipBtn = document.getElementById('btn-skip-letter');
      const replayBtn = document.getElementById('btn-replay-letter');
      const footerBubu = document.getElementById('letter-footer-bubu');

      if (!container) return;
      clearTyping();
      isSkipped = false;
      isFinished = false;

      container.innerHTML = '';
      if (statusEl) statusEl.innerHTML = '<span class="pencil-live-dot"></span> Escribiendo con amor para ti...';
      if (skipBtn) skipBtn.style.display = 'inline-flex';
      if (replayBtn) replayBtn.style.display = 'none';
      if (footerBubu) footerBubu.style.display = 'none';

      // Cursor de lápiz animado
      const caret = document.createElement('span');
      caret.className = 'pencil-caret';
      caret.innerHTML = '✏️';

      let secIdx = 0;

      function typeSection() {
        if (isSkipped || secIdx >= LETTER_SECTIONS.length) {
          finishLetter();
          return;
        }

        const sec = LETTER_SECTIONS[secIdx];
        const el = document.createElement(sec.type === 'question' ? 'h3' : 'p');
        el.className = sec.className;
        container.appendChild(el);

        // Si es acróstico, poner la primera letra en negrita destacada de inmediato
        if (sec.acrosticLetter) {
          const strong = document.createElement('strong');
          strong.className = 'acrostic-letter';
          strong.textContent = sec.acrosticLetter;
          el.appendChild(strong);
        }

        el.appendChild(caret);

        let charIdx = 0;
        const text = sec.text;

        function typeChar() {
          if (isSkipped) {
            finishLetter();
            return;
          }

          if (charIdx < text.length) {
            const ch = text[charIdx];
            el.insertBefore(document.createTextNode(ch), caret);
            charIdx++;

            // Velocidad fluida y natural de estilográfica/lápiz (10-18ms)
            let delay = 12 + Math.floor(Math.random() * 8);
            if (ch === ',' || ch === ';') delay = 70;
            else if (ch === '.' || ch === '!') delay = 130;
            else if (ch === ' ') delay = 16;

            const t = setTimeout(typeChar, delay);
            typingTimeouts.push(t);
          } else {
            // Pausa breve entre párrafos
            const t = setTimeout(() => {
              secIdx++;
              typeSection();
            }, 180);
            typingTimeouts.push(t);
          }
        }

        typeChar();
      }

      typeSection();
    }

    // Función para descargar la carta en PDF bonito
    function downloadLetterPDF() {
      const element = document.getElementById('letter-body-card');
      if (!element) return;

      // Si aún está escribiendo, terminarla de inmediato para que el PDF salga completo
      if (!isFinished) {
        renderFullLetter();
      }

      const btnTop = document.getElementById('btn-download-pdf-top');
      const btnBottom = document.getElementById('btn-download-pdf-bottom');
      const originalText = btnTop ? btnTop.innerHTML : '📥 Descargar PDF ♡';

      if (btnTop) btnTop.innerHTML = '⏳ Generando PDF...';
      if (btnBottom) btnBottom.innerHTML = '⏳ Generando PDF...';

      // Asegurar que Bubu y Dudu sean visibles en el PDF
      const footerBubu = document.getElementById('letter-footer-bubu');
      if (footerBubu) footerBubu.style.display = 'flex';

      const opt = {
        margin: [12, 12, 14, 12],
        filename: 'Carta_Para_Raquel_♡_Jeremy.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: {
          scale: 2,
          useCORS: true,
          logging: false,
          letterRendering: true
        },
        jsPDF: {
          unit: 'mm',
          format: 'a4',
          orientation: 'portrait'
        },
        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
      };

      if (window.html2pdf) {
        window.html2pdf().set(opt).from(element).save().then(() => {
          if (btnTop) btnTop.innerHTML = '✅ ¡PDF Descargado!';
          if (btnBottom) btnBottom.innerHTML = '✅ ¡PDF Descargado!';
          setTimeout(() => {
            if (btnTop) btnTop.innerHTML = originalText;
            if (btnBottom) btnBottom.innerHTML = '📥 Descargar Carta en PDF ♡';
          }, 3500);
        }).catch(err => {
          console.warn("Fallback a impresión de navegador:", err);
          window.print();
          if (btnTop) btnTop.innerHTML = originalText;
          if (btnBottom) btnBottom.innerHTML = '📥 Descargar Carta en PDF ♡';
        });
      } else {
        window.print();
        if (btnTop) btnTop.innerHTML = originalText;
        if (btnBottom) btnBottom.innerHTML = '📥 Descargar Carta en PDF ♡';
      }
    }

    // Inicializar eventos al cargar el DOM
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('btn-skip-letter')?.addEventListener('click', () => {
        renderFullLetter();
      });

      document.getElementById('btn-replay-letter')?.addEventListener('click', () => {
        startPencilTyping();
      });

      document.getElementById('btn-download-pdf-top')?.addEventListener('click', downloadLetterPDF);
      document.getElementById('btn-download-pdf-bottom')?.addEventListener('click', downloadLetterPDF);

      // Iniciar escritura automática
      setTimeout(startPencilTyping, 400);
    });

    if (document.readyState !== 'loading') {
      setTimeout(startPencilTyping, 400);
    }
  </script>
